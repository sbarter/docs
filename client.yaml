openapi: 3.0.3
info:
  title: Game Studio API - Sbarter Integration (Client Implementation)
  version: 1.0.0
  description: >
    This OpenAPI describes the endpoints that the Game Studio must implement.
    These endpoints are called by Sbarter (the Platform).


    - Every call is `POST` with `Content-Type: application/json` and the `X-API-Key` header
      holding the key the Game Studio issued to Sbarter for this environment.

    - Sbarter waits up to 10 seconds. Any 2xx counts as delivered; the body is not read, except
      where an endpoint below defines a response body.

    - 4xx is read as the Game Studio refusing that request (bad input, unknown account or game).
      5xx, 429 and timeouts are treated as the Game Studio being unavailable.

    - 401/403 are treated as a configuration problem on Sbarter's side (wrong key), not as a
      player error.

    - Calls that carry a `webhookUrl` expect the decision later on that URL (the Sbarter API, see
      the Server Implementation document).

servers:
  - url: https://game-studio.example.com
    description: Game Studio base URL

security:
  - ApiKeyAuth: []

tags:
  - name: VGP - In App Confirmation
    description: Account linking initiation via in-app confirmation (Sbarter -> Game Studio)
  - name: Provider Profile
    description: Current provider profile retrieval for already-linked accounts (Sbarter -> Game Studio)
  - name: Web Game - Player Provisioning
    description: Player account creation for web games (Sbarter -> Game Studio)
  - name: Session
    description: Session registration on Game Studio side (Sbarter -> Game Studio)
  - name: Web Game - Launch
    description: The game page the Sbarter app opens in its WebView (Sbarter app -> Game Studio)
  - name: Challenge
    description: Challenge lifecycle notifications (Sbarter -> Game Studio)

paths:
  /v1/sbarter/gamer/validate/in-app:
    post:
      tags: [VGP - In App Confirmation]
      summary: Initiate in-app confirmation linking
      description: >
        Sbarter requests the Game Studio to confirm account ownership inside the game.
        This Level 3 contract assumes Sbarter already knows the stable provider-side
        account identifier (`providerUserId`) that must be confirmed.
        Game Studio must present an in-app prompt to the player and later call the
        webhookUrl (Sbarter endpoint) with the final decision.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InAppConfirmationRequest'
      responses:
        "202":
          description: Accepted for processing
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "429":
          description: Too many requests
        "500":
          description: Internal server error

  /v1/sbarter/gamer/profile:
    post:
      tags: [Provider Profile]
      summary: Fetch current provider profile snapshot
      description: >
        Sbarter requests the current provider profile snapshot for an already-known
        provider-side account.
        This endpoint is separate from linking and can be used later to refresh
        the current provider display name and generic provider metrics for an
        existing account link.
        Because this is a synchronous single-profile request, the response does
        not need to echo the request identifiers back.
        The request only needs provider-side identifiers that the partner can
        resolve directly.
        Sbarter does not call this endpoint in the current Level 3 flow: the profile
        snapshot arrives with an accepted in-app linking decision instead.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileRequest'
      responses:
        "200":
          description: Provider profile snapshot successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileResponse'
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "404":
          description: Provider profile not found for the supplied account
        "429":
          description: Too many requests
        "500":
          description: Internal server error

  /v1/sbarter/gamer/provision:
    post:
      tags: [Web Game - Player Provisioning]
      summary: Create or reuse a player account for a web game
      operationId: provisionPlayer
      description: >
        Web games only. Sbarter asks the Game Studio to create a game account for a Sbarter player,
        so the player can open the game without signing up in it. There is no account linking for
        web games: Sbarter calls this before it registers the player's first match.


        `playerId` is an opaque id Sbarter issues per player and per studio. It never changes for
        that player, it is not the player's Sbarter user id, and another studio gets a different
        one for the same player. Use it as the account's key: from now on it is the player's
        `providerUserId` in every call, in both directions. No personal data is sent and none is
        expected back.


        Idempotent on `playerId`: a repeat for an account that exists answers `200` and changes
        nothing. Sbarter repeats the call after a timeout or a 5xx.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionPlayerRequest'
      responses:
        "200":
          description: The account already existed (safe repeat)
        "201":
          description: The account was created
        "400":
          description: Invalid request, or a providerGameId that is not a web game of this studio
        "401":
          description: Missing or invalid API key
        "429":
          description: Too many requests
        "500":
          description: Internal server error

  /v1/session:
    post:
      tags: [Session]
      summary: Register a game session
      description: >
        Registers a new 1v1 game session on the Game Studio side, linked to an internal
        Sbarter sessionId.
        For games played in the player's own copy of the game, this flow assumes both players have
        already linked and validated their provider-side accounts before session registration
        begins. For web games, both players were provisioned instead
        (`POST /v1/sbarter/gamer/provision`), and each player's `internalId` and `providerUserId`
        both carry that player's `playerId`.
        Players are listed by seat: seat 1 (the challenge creator) first, seat 2 second. The seat
        is what a redeemed launch code later authorises.
        The response carries the Game Studio's own id of the match (`matchId`). It is required for
        web games: Sbarter returns it to the game when a player's launch code is redeemed, and a
        result must quote the same id. Return the same `matchId` on a repeated registration.
        The provided webhookUrl MUST be used when sending results back to Sbarter.
        `sessionId` acts as the idempotency key for repeated registration attempts.
        Repeated calls with the same `sessionId` and the same effective payload must be
        treated as safe retries.
        The current Level 3 contract does not define a later Sbarter -> Game Studio
        session-cancellation callback.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        "200":
          description: Session already registered for the same sessionId (idempotent replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreateResponse'
        "201":
          description: Session successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreateResponse'
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "409":
          description: SessionId already exists with a conflicting payload
        "429":
          description: Too many requests
        "500":
          description: Internal server error

  /v1/challenge/creation:
    post:
      tags: [Challenge]
      summary: Challenge created
      operationId: sendChallengeCreation
      description: >
        Sbarter tells the Game Studio a challenge was created in its game. Players hold the creator
        only, as a linked player (internalId + providerUserId).
        A notification: nothing is expected back beyond a 2xx, and the Game Studio decides how to
        surface it in the game.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeNotificationRequest'
      responses:
        "2XX":
          description: Notification accepted
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error

  /v1/challenge/invite:
    post:
      tags: [Challenge]
      summary: Challenge invite
      operationId: sendChallengeInvite
      description: >
        Sbarter tells the Game Studio which linked players were invited to a challenge in its game.
        A notification: nothing is expected back beyond a 2xx, and the Game Studio decides how to
        surface it in the game.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeNotificationRequest'
      responses:
        "2XX":
          description: Notification accepted
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error

  /v1/challenge/acceptance:
    post:
      tags: [Challenge]
      summary: Challenge accepted
      operationId: sendChallengeAcceptance
      description: >
        Sbarter tells the Game Studio a challenge was accepted. Players are ordered creator first, opponent second.
        A notification: nothing is expected back beyond a 2xx, and the Game Studio decides how to
        surface it in the game.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeNotificationRequest'
      responses:
        "2XX":
          description: Notification accepted
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error

  /v1/challenge/await-opponent:
    post:
      tags: [Challenge]
      summary: Waiting for the opponent
      operationId: sendChallengeAwaitOpponent
      description: >
        Sbarter tells the Game Studio a player is ready and waiting for the other participant. Players are ordered waiting player first, opponent second.
        A notification: nothing is expected back beyond a 2xx, and the Game Studio decides how to
        surface it in the game.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeNotificationRequest'
      responses:
        "2XX":
          description: Notification accepted
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error

  /v1/challenge/completion:
    post:
      tags: [Challenge]
      summary: Challenge completed
      operationId: sendChallengeCompletion
      description: >
        Sbarter tells the Game Studio a challenge has finished.
        A notification: nothing is expected back beyond a 2xx, and the Game Studio decides how to
        surface it in the game.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCompletionRequest'
      responses:
        "2XX":
          description: Notification accepted
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error

  /your-launch-url:
    post:
      tags: [Web Game - Launch]
      summary: Open the game for a player (WebView form POST)
      operationId: launchWebGame
      description: >
        Web games only. Not an API call from Sbarter's servers: when a player taps **Start match**,
        the Sbarter app opens this page in its WebView with an HTTPS form POST. The path above is a
        placeholder - the real address is the HTTPS launch URL registered for the game at
        onboarding, and only HTTPS origins you registered are allowed in the WebView.


        The body carries a one-time `launchCode` and its `codeVerifier`. Neither identifies the
        player or the match on its own: redeem them from your backend with
        `POST /v1/game-launches/redeem` (Sbarter API) and take the match, the player and the seat
        from that answer only. Never trust a match id, player id or seat in the page URL.


        After a successful redeem, start a session for that seat (for example a `Secure`,
        `HttpOnly` cookie scoped to your host) and redirect to a clean game URL without the code.
        Enforce the seat on every gameplay request and WebSocket. A player who opens the game again
        arrives with a new code; replace their previous play session for that seat.


        The code lives 60 seconds and works once. If the redeem is refused, show your own page
        with a way back to the app; the player gets a fresh code by tapping **Start match** again.
        Keep both values out of URLs, logs and analytics.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebGameLaunchForm'
      responses:
        "303":
          description: Redeemed; redirect to the game page for the authorised seat
        "200":
          description: Your own page (game page after redeem, or an error page when the redeem was refused)

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Partner API key issued by the Game Studio for Sbarter to call Game Studio endpoints.

  schemas:
    ChallengePlayer:
      type: object
      required: [internalId, providerUserId]
      properties:
        internalId:
          type: string
          description: Sbarter player identifier.
        providerUserId:
          type: string
          description: The player's linked account identifier in the Game Studio.

    ChallengeNotificationRequest:
      type: object
      required: [challengeId, providerGameId, players]
      properties:
        challengeId:
          type: string
          description: Sbarter challenge identifier.
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
        players:
          type: array
          items:
            $ref: '#/components/schemas/ChallengePlayer'

    ChallengeCompletionRequest:
      type: object
      required: [challengeId, providerGameId]
      properties:
        challengeId:
          type: string
          description: Sbarter challenge identifier.
        providerGameId:
          type: string
          description: Stable provider-side game identifier.

    InAppConfirmationRequest:
      type: object
      required: [internalId, providerGameId, providerUserId, expiresAt, webhookUrl]
      properties:
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "someuuidorsometihingelse"
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier to be confirmed in-game. This is not necessarily the player's display name.
          example: "user123456"
        expiresAt:
          type: string
          format: date-time
          description: Latest time at which the in-app confirmation request remains valid.
          example: "2025-12-12T13:00:00Z"
        webhookUrl:
          type: string
          format: uri
          description: Sbarter callback URL that must later receive the final linking decision. The partner must call this exact URL as provided; it already contains the concrete requestId path value and should not be reconstructed manually.
          example: "https://partners.dev.sbarter.com/acme/v1/linking/in-app/a2f7c8b1-7f28-4a8d-9c35-cc2b3c2b4a11"

    ProviderProfileRequest:
      type: object
      required: [providerGameId, providerUserId]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier whose latest provider profile snapshot Sbarter wants to fetch.
          example: "user123456"

    ProviderProfileResponse:
      type: object
      required: [providerDisplayName, profileCapturedAt]
      properties:
        providerDisplayName:
          type: string
          description: Current human-readable provider display name for this account. If the provider does not distinguish between account ID and display name, return the best user-facing name available.
          example: "PlayerOne"
        profileCapturedAt:
          type: string
          format: date-time
          description: Timestamp at which the returned provider profile snapshot was captured or refreshed by the partner.
          example: "2025-12-12T12:44:58Z"
        profileStats:
          $ref: '#/components/schemas/ProfileStats'

    ProfileStats:
      type: object
      description: Optional generic provider-defined profile metrics. Keep provider-specific metrics inside this object rather than promoting them to shared top-level fields. This object may be empty if the provider exposes no extra profile metrics.
      additionalProperties: {}
      example:
        current_trophies: 5123
        best_trophies: 5400
        ranked_rating: 1675

    PlayerMatchEntry:
      type: object
      required: [internalId, providerUserId]
      properties:
        providerUserId:
          type: string
          description: Stable provider-side account identifier for this player. This is not necessarily the player's display name.
          example: "Player#1234"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map provider-side players back to the correct Sbarter user.
          example: "user-12345"

    ProvisionPlayerRequest:
      type: object
      required: [playerId, providerGameId]
      properties:
        playerId:
          type: string
          format: uuid
          description: >-
            Opaque Sbarter id of the player at your studio. Stable for this player, different at
            every studio, never the Sbarter user id. Use it as the account's providerUserId.
          example: "8a4f1c2e-5b6d-4e7f-9a0b-1c2d3e4f5a6b"
        providerGameId:
          type: string
          description: Stable provider-side game identifier of the web game.
          example: "some-web-game"

    SessionCreateResponse:
      type: object
      properties:
        matchId:
          type: string
          description: >-
            Your own id of the match. Required for web games, optional otherwise. The same value
            must come back on a repeated registration of the same sessionId, and in the result.
          example: "match-7f3a91"

    WebGameLaunchForm:
      type: object
      required: [launchCode, codeVerifier]
      properties:
        launchCode:
          type: string
          description: One-time launch code, valid for 60 seconds.
        codeVerifier:
          type: string
          description: The PKCE verifier the app generated for this code (RFC 7636, S256).

    SessionCreateRequest:
      type: object
      required: [providerGameId, sessionId, players, expiresAt, webhookUrl]
      properties:
        challengeId:
          type: string
          format: uuid
          description: Sbarter challenge the session belongs to. Same value as in the challenge notifications, so a session can be tied to the invite the players saw.
          example: "0196f4a0-7c1e-7b2a-9d3e-2f1a4b5c6d7e"
        providerGameId:
          type: string
          description: Stable provider-side game identifier for the session being created.
          example: "chess game"
        sessionId:
          type: string
          format: uuid
          description: Canonical Sbarter session identifier. This value acts as the idempotency key for repeated session registration attempts.
          example: "123e4567-e89b-12d3-a456-426614174000"
        players:
          type: array
          minItems: 2
          maxItems: 2
          description: >-
            Exactly two players participating in the current Level 3 1v1 session, seat 1 (the
            challenge creator) first. For web games, internalId and providerUserId are both the
            player's playerId.
          items:
            $ref: '#/components/schemas/PlayerMatchEntry'
        rules:
          type: array
          description: Optional provider-defined rules, modifiers, or campaign identifiers for this session.
          items:
            type: string
          example: ["rule12313", "someloremipsum"]
        expiresAt:
          type: string
          format: date-time
          description: Latest time at which the registered provider-side session is considered valid.
          example: "2025-12-12T13:00:00Z"
        webhookUrl:
          type: string
          format: uri
          description: Sbarter callback URL that must receive the final result for this session.
          example: "https://partners.sbarter.com/<slug>/v1/webhooks/game-studio/match-result"
