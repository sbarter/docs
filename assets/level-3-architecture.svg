<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a studio and Sbarter talk"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2128"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6170"/></marker></defs><rect x="0.5" y="0.5" width="1079" height="559" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="34" font-size="17" font-weight="700" fill="#1c2128">How a studio and Sbarter talk</text><text x="150" y="70" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#e8590c">GAME STUDIO</text><text x="700" y="70" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#3b5bdb">SBARTER</text><line x1="300" y1="60" x2="300" y2="540" stroke="#d0d7de" stroke-dasharray="5 5"/><rect x="40" y="90" width="220" height="70" rx="10" fill="#e8590c" fill-opacity="0.08" stroke="#e8590c" stroke-width="1.6"/><text x="150.0" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e8590c">Your game</text><text x="150.0" y="136" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">game client</text><rect x="40" y="250" width="220" height="90" rx="10" fill="#e8590c" fill-opacity="0.08" stroke="#e8590c" stroke-width="1.6"/><text x="150.0" y="276" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e8590c">Studio backend</text><text x="150.0" y="296" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">implements the VGP API</text><text x="150.0" y="313" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">calls the Sbarter API</text><rect x="370" y="90" width="300" height="70" rx="10" fill="#3b5bdb" fill-opacity="0.08" stroke="#3b5bdb" stroke-width="1.6"/><text x="520.0" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3b5bdb">Keycloak</text><text x="520.0" y="136" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">realm studio_investor</text><rect x="370" y="250" width="300" height="90" rx="10" fill="#3b5bdb" fill-opacity="0.08" stroke="#3b5bdb" stroke-width="1.6"/><text x="520.0" y="276" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3b5bdb">partners.&lt;env&gt;.sbarter.com/&lt;slug&gt;</text><text x="520.0" y="296" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">one host per studio</text><rect x="370" y="420" width="300" height="100" rx="10" fill="#3b5bdb" fill-opacity="0.08" stroke="#3b5bdb" stroke-width="1.6"/><text x="520.0" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3b5bdb">Studio adapter</text><text x="520.0" y="466" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">checks the studio token</text><text x="520.0" y="483" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">calls the VGP API</text><text x="520.0" y="500" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">builds the callback URLs</text><rect x="770" y="420" width="270" height="100" rx="10" fill="#3b5bdb" fill-opacity="0.08" stroke="#3b5bdb" stroke-width="1.6"/><text x="905.0" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3b5bdb">Sbarter platform</text><text x="905.0" y="466" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">linking, sessions, results</text><text x="905.0" y="483" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">challenges and payouts</text><rect x="770" y="250" width="270" height="90" rx="10" fill="#2b8a3e" fill-opacity="0.08" stroke="#2b8a3e" stroke-width="1.6"/><text x="905.0" y="276" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2b8a3e">Sbarter app</text><text x="905.0" y="296" text-anchor="middle" font-size="12" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#5b6170">the player</text><line x1="150" y1="160" x2="150" y2="248" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text x="150.0" y="196.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2128"></text><line x1="262" y1="270" x2="368" y2="125" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)"/><text x="292" y="196" text-anchor="end" font-size="12.5" font-weight="600" fill="#1c2128">1  client_credentials</text><text x="292" y="212" text-anchor="end" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">POST .../token</text><line x1="262" y1="312" x2="368" y2="312" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)"/><text x="315" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2128">2  Sbarter API</text><text x="315" y="280" text-anchor="middle" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">Bearer &lt;token&gt;</text><line x1="520" y1="340" x2="520" y2="418" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)"/><text x="520.0" y="371.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2128"></text><line x1="672" y1="470" x2="768" y2="470" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)"/><text x="720" y="461" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2128">internal</text><line x1="368" y1="490" x2="150" y2="342" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)"/><text x="228" y="448" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2128">3  VGP API</text><text x="228" y="464" text-anchor="middle" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">X-API-Key</text><line x1="905" y1="340" x2="905" y2="418" stroke="#1c2128" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text x="905.0" y="371.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2128"></text><text x="905" y="235" text-anchor="middle" font-size="12" fill="#5b6170">deep links open here</text></svg>