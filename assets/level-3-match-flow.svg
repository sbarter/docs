width="184" height="46" rx="9" fill="#e8590c" fill-opacity="0.10" stroke="#e8590c" stroke-width="1.5"/><text x="680.0" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#e8590c">Studio backend</text><rect x="588.0" y="696" width="184" height="46" rx="9" fill="#e8590c" fill-opacity="0.10" stroke="#e8590c" stroke-width="1.5"/><text x="680.0" y="725" text-anchor="middle" font-size="14" font-weight="600" fill="#e8590c">Studio backend</text><line x1="960.0" y1="110" x2="960.0" y2="696" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="868.0" y="64" width="184" height="46" rx="9" fill="#e8590c" fill-opacity="0.10" stroke="#e8590c" stroke-width="1.5"/><text x="960.0" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#e8590c">Game</text><rect x="868.0" y="696" width="184" height="46" rx="9" fill="#e8590c" fill-opacity="0.10" stroke="#e8590c" stroke-width="1.5"/><text x="960.0" y="725" text-anchor="middle" font-size="14" font-weight="600" fill="#e8590c">Game</text><line x1="120.0" y1="144" x2="394.0" y2="144" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="260.0" y="136" text-anchor="middle" font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1c2128" font-weight="600">Create / accept a challenge</text><line x1="400.0" y1="188" x2="674.0" y2="188" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="540.0" y="180" text-anchor="middle" font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1c2128" font-weight="600">POST /v1/challenge/invite · /acceptance · /await-opponent</text><text x="540.0" y="205" text-anchor="middle" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">X-API-Key · informational, answer 2xx</text><line x1="120.0" y1="246" x2="394.0" y2="246" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="260.0" y="238" text-anchor="middle" font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1c2128" font-weight="600">Both players are ready</text><line x1="400.0" y1="290" x2="674.0" y2="290" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="540.0" y="282" text-anchor="middle" font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1c2128" font-weight="600">POST /v1/session</text><text x="540.0" y="307" text-anchor="middle" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">X-API-Key · sessionId, players, rules, expiresAt, webhookUrl</text><line x1="680.0" y1="348" x2="406.0" y2="348" stroke="#5b6170" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="540.0" y="340" text-anchor="middle" font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170" font-weight="400">201 Created (same payload again: 200, different: 409)</text><line x1="120.0" y1="392" x2="954.0" y2="392" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="540.0" y="384" text-anchor="middle" font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1c2128" font-weight="600">Play the match</text><line x1="960.0" y1="436" x2="686.0" y2="436" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="820.0" y="428" text-anchor="middle" font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1c2128" font-weight="600">Match finished</text><line x1="680.0" y1="480" x2="406.0" y2="480" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="540.0" y="472" text-anchor="middle" font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1c2128" font-weight="600">POST /v1/webhooks/game-studio/match-result</text><text x="540.0" y="497" text-anchor="middle" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">Bearer (webhook.write) · sessionId, matchId, status, 2 players</text><line x1="400.0" y1="538" x2="674.0" y2="538" stroke="#5b6170" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="540.0" y="530" text-anchor="middle" font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170" font-weight="400">202 Accepted (sessionId + matchId is the idempotency key)</text><line x1="400.0" y1="582" x2="674.0" y2="582" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="540.0" y="574" text-anchor="middle" font-size="13" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1c2128" font-weight="600">POST /v1/challenge/completion</text><text x="540.0" y="599" text-anchor="middle" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#5b6170">X-API-Key</text><line x1="400.0" y1="640" x2="126.0" y2="640" stroke="#1c2128" stroke-width="1.6" marker-end="url(#a)"/><text x="260.0" y="632" text-anchor="middle" font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1c2128" font-weight="600">Result and payout</text></svg>