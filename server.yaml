openapi: 3.0.3
info:
  title: Sbarter API - Game Studio Integration (Server Implementation)
  version: 1.0.0
  description: |
    # Sbarter Integration Services
    This OpenAPI specification defines the secure endpoints hosted by **Sbarter** that are consumed by the **Game Studio** backend. 
    These services facilitate the "callback" phase of the integration lifecycle, ensuring data synchronization between the game 
    environment and the Sbarter platform.

    ## Core Components
    1. **Authentication (Keycloak):** All requests to Sbarter endpoints must be authorized via the OAuth2 Client Credentials flow. 
    This document includes the token endpoint configuration for obtaining Bearer tokens.
    
    2. **Verification Webhooks:** Endpoints used by the Studio to report the outcome of in-game player actions, such as the **In-App Account Linking** result.
    
    3. **Match Performance Webhooks:** Endpoints used to submit game results, player statistics, and match outcomes to the Sbarter Virtual Game Processor (VGP).

    ---
    ### Integration Flow
    For a visual overview of how these endpoints fit into the player journey, please refer to the **Account Linking Flow** diagram below:

    ![Account Linking Flow](https://github.com/sbarter/docs/edit/main/Game Studio Flow.png)

    *Note: Before calling these webhooks, ensure your Studio Backend has successfully exchanged its credentials for a valid JWT at the Keycloak endpoint defined in the Security section.*

servers:
  - url: https://webhook.dev.sbarter.com
    description: Sbarter API
  - url: https://keycloak.dev.sbarter.com
    description: Sbarter Identity Provider (Keycloak)

tags:
  - name: VGP - In App Confirmation
    description: Game Studio -> Sbarter for account linking result
  - name: VGP - DeepLink
    description: Game Studio -> Sbarter deep link generation (opens Sbarter mobile app)
  - name: Webhook
    description: Game Studio -> Sbarter webhook endpoints (game results)
  - name: OAuth 2.0 Client Credentials
    description: Token issuance endpoint (Keycloak)

paths:
  /v1/linking/in-app/{requestId}:
    post:
      tags:
        - VGP - In App Confirmation
      summary: Linking result (accepted/rejected/expired)
      operationId: postInAppLinkingResult
      description: >
        Game Studio calls this endpoint after the user confirms or rejects linking inside the game.
        This is the FINAL decision for the given requestId.
        When linking is accepted, the payload must include the verified
        provider profile snapshot captured at link time.

        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.write
      parameters:
        - name: requestId
          in: path
          required: true
          description: Linking request identifier (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InAppLinkingResultWebhook'
      responses:
        "202":
          description: Accepted for processing
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Forbidden
        "409":
          description: Request already processed (idempotency)
        "500":
          description: Internal server error


  /v1/linking/deeplink/generate:
    post:
      tags:
        - VGP - DeepLink
      summary: Generate confirmation deep link
      operationId: generateLinkingDeepLink
      description: >
        Generates a one-time confirmation deep link that opens the Sbarter mobile application.

        The Game Studio typically calls this endpoint, then delivers the returned deepLink
        to the user via push notification / in-app message / email.

        When the user follows the deepLink, the Sbarter app opens and Sbarter finalizes the linking flow.
        This helper flow assumes the stable provider-side account identifier is already known.
        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.deeplink.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepLinkGenerateRequest'
            example:
              requestId: "a2f7c8b1-7f28-4a8d-9c35-cc2b3c2b4a11"
              providerGameId: "some-game-id"
              ruleId: "rule-123"
              providerUserId: "user123456"
              expiresAt: "2025-12-12T13:00:00Z"
      responses:
        "200":
          description: Deep link generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepLinkGenerateResponse'
              example:
                linkId: "dl_01HZZZ8YQ2K3F7Z9P8"
                deepLink: "sbarter://linking/confirm/dl_01HZZZ8YQ2K3F7Z9P8"
                expiresAt: "2025-12-12T13:00:00Z"
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Forbidden
        "500":
          description: Internal server error

  /v1/webhooks/game-studio/match-result:
    post:
      tags:
        - Webhook
      summary: Receive match result webhook
      operationId: postMatchResultWebhook
      description: >
        Game Studio sends match results for a previously created 1v1 match/session.
        Retries are expected. Duplicate deliveries of the same logical result must be safe,
        using `sessionId + matchId` as the idempotency key.
        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - webhook.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameResultWebhookPayload'
      responses:
        "202":
          description: Webhook accepted, including safe duplicate retries
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Forbidden
        "500":
          description: Internal server error

  /realms/studio_investor/protocol/openid-connect/token:
    post:
      servers:
        - url: https://keycloak.dev.sbarter.com
        - url: https://keycloak.test.sbarter.com
        - url: https://id.sbarter.com
      tags:
        - OAuth 2.0 Client Credentials
      summary: Obtain Access Token (Client Credentials)
      operationId: obtainClientCredentialsToken
      description: >
        Issues an access token using OAuth 2.0 Client Credentials Grant.
        The returned token_type is "Bearer".
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
            examples:
              client_credentials:
                value:
                  grant_type: client_credentials
                  client_id: "<client_id>"
                  client_secret: "<client_secret>"
      responses:
        "200":
          description: Token successfully issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                ok:
                  value:
                    access_token: "<jwt>"
                    token_type: "Bearer"
                    expires_in: 300
        "400":
          description: Invalid request
        "401":
          description: Invalid client credentials
        "429":
          description: Too many requests
        "500":
          description: Internal server error

components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials Grant used by Game Studio when calling Sbarter webhooks.
        clientId/clientSecret are managed in Keycloak and bound to a specific studio/game.
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.dev.sbarter.com/realms/studio_investor/protocol/openid-connect/token
          scopes:
            linking.write: Send in-app linking result to Sbarter.
            linking.deeplink.write: Generate linking deep links.
            webhook.write: Send match result webhooks to Sbarter.

  schemas:
    InAppLinkingResultWebhook:
      oneOf:
        - $ref: '#/components/schemas/InAppLinkingResultAcceptedWebhook'
        - $ref: '#/components/schemas/InAppLinkingResultRejectedWebhook'
        - $ref: '#/components/schemas/InAppLinkingResultExpiredWebhook'
      discriminator:
        propertyName: status
        mapping:
          accepted: '#/components/schemas/InAppLinkingResultAcceptedWebhook'
          rejected: '#/components/schemas/InAppLinkingResultRejectedWebhook'
          expired: '#/components/schemas/InAppLinkingResultExpiredWebhook'

    InAppLinkingResultAcceptedWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt, providerDisplayName, profileCapturedAt, profileStats]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was verified during linking. This is not necessarily the player's display name.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the verified provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        providerDisplayName:
          type: string
          description: Verified human-readable provider display name captured at link time.
          example: "PlayerOne"
        status:
          type: string
          enum: [accepted]
          example: "accepted"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T12:45:10Z"
        profileCapturedAt:
          type: string
          format: date-time
          description: Timestamp at which the provider profile snapshot was captured.
          example: "2025-12-12T12:44:58Z"
        profileStats:
          $ref: '#/components/schemas/ProfileStats'

    InAppLinkingResultRejectedWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was targeted for verification.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        status:
          type: string
          enum: [rejected]
          example: "rejected"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T12:45:10Z"

    InAppLinkingResultExpiredWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was targeted for verification.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        status:
          type: string
          enum: [expired]
          example: "expired"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T13:00:00Z"

    GameResultStatus:
      type: string
      enum: [win, draw, failed, voided]

    PlayerGameResult:
      type: object
      required: [providerUserId, internalId, outcome]
      properties:
        providerUserId:
          type: string
          description: Stable provider-side account identifier for this player. This is not necessarily the player's display name.
          example: "Player#1234"
        internalId:
          type: string
          nullable: true
          description: Sbarter internal player identifier used to map provider-side players back to the correct Sbarter user.
          example: "sbarter-user-12345"
        outcome:
          type: string
          enum: [win, loss, draw]
          example: "win"

    GameResultWebhookPayload:
      type: object
      required: [providerGameId, sessionId, matchId, status, players]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "real boxing 3"
        sessionId:
          type: string
          format: uuid
          description: Canonical Sbarter session identifier. Together with `matchId`, this forms the idempotency key for retries.
          example: "123e4567-e89b-12d3-a456-426614174000"
        matchId:
          type: string
          description: Provider-side match identifier associated with the reported result.
          example: "real-boxing-match-abc-123"
        status:
          $ref: '#/components/schemas/GameResultStatus'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional provider-side match start timestamp.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional provider-side match completion timestamp.
        players:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly two player result entries for the current Level 3 1v1 match flow.
          items:
            $ref: '#/components/schemas/PlayerGameResult'

    ProfileStats:
      type: object
      description: Generic provider-defined profile metrics captured at link time. Keep provider-specific metrics inside this object rather than promoting them to shared top-level fields.
      additionalProperties: {}
      example:
        current_trophies: 5123
        best_trophies: 5400
        ranked_rating: 1675

    ClientCredentialsTokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          example: client_credentials
        client_id:
          type: string
          example: "<client_id>"
        client_secret:
          type: string
          example: "<client_secret>"

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          example: "<jwt>"
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          example: 300
        scope:
          type: string
          nullable: true
          example: "webhook.write"
    DeepLinkGenerateRequest:
      type: object
      required: [requestId, providerGameId, ruleId, providerUserId, expiresAt]
      properties:
        requestId:
          type: string
          format: uuid
          description: Linking request identifier.
          example: "a2f7c8b1-7f28-4a8d-9c35-cc2b3c2b4a11"
        providerGameId:
          type: string
          description: Provider game identifier.
          example: "some-game-id"
        ruleId:
          type: string
          description: Optional rule or campaign identifier used by studio.
          example: "rule-123"
        providerUserId:
          type: string
          description: Stable provider-side account identifier.
          example: "user123456"
        expiresAt:
          type: string
          format: date-time
          description: Expiration moment for the deep link.
          example: "2025-12-12T13:00:00Z"

    DeepLinkGenerateResponse:
      type: object
      required: [linkId, deepLink, expiresAt]
      properties:
        linkId:
          type: string
          description: Unique deep link identifier.
          example: "dl_01HZZZ8YQ2K3F7Z9P8"
        deepLink:
          type: string
          description: Deep link that opens Sbarter app.
          example: "sbarter://linking/confirm/dl_01HZZZ8YQ2K3F7Z9P8"
        expiresAt:
          type: string
          format: date-time
          description: Expiration moment for the deep link.
          example: "2025-12-12T13:00:00Z"
