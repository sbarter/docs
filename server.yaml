openapi: 3.0.3
info:
  title: Sbarter API - Game Studio Integration (Server Implementation)
  version: 1.0.0
  description: >
    This OpenAPI describes the endpoints exposed by Sbarter that the Game Studio calls:

    - In-app linking result webhook

    - Linking deep link generation

    - Linking status lookup

    - Match result webhooks

    - The studio's games and their challenge settings

    - The studio's active challenges

    - Challenge creation deep link generation


    It also documents the OAuth2 Client Credentials token endpoint (Keycloak).


    **Before the first call**

    - Client credentials: create them in the Sbarter web portal (your studio -> API credentials).
      The secret is shown once. Every token issued to that client is pinned to your studio.

    - `providerGameId`: Sbarter registers each of your games against your studio with a
      `providerGameId` - the id you send for that game in every call. It is set by Sbarter, it is
      not the game name shown in the portal; ask Sbarter for it. An id that is not registered (or
      registered only as your studio's default entry) is refused.

    - Your API host: Sbarter gives you a slug (e.g. `acme`). Every call in this document goes to
      `https://partners.<env>.sbarter.com/<slug>` - the paths below are appended to it, e.g.
      `https://partners.sbarter.com/acme/v1/linking/status`.

    - For Sbarter -> studio calls (see the VGP API), give Sbarter your base URL and an API key
      per environment. Until your API is ready, Sbarter can point your studio at its sandbox, which
      plays your side so you can test this API end to end.


    **Environments** - each has its own credentials; a token from one is refused by the others.

    | Environment | API | Token URL |
    |---|---|---|
    | Development | `https://partners.dev.sbarter.com/<slug>` | `https://keycloak.dev.sbarter.com/realms/studio_investor/protocol/openid-connect/token` |
    | Staging | `https://partners.test.sbarter.com/<slug>` | `https://keycloak.test.sbarter.com/realms/studio_investor/protocol/openid-connect/token` |
    | Production | `https://partners.sbarter.com/<slug>` | `https://id.sbarter.com/realms/studio_investor/protocol/openid-connect/token` |

    The quickest check that everything is in place - credentials, studio, slug, gateway - is
    `GET /v1/auth/check`: `204` means the next calls will be accepted.


    **Headers on every call**

    | Header | Value |
    |---|---|
    | `Authorization` | `Bearer <access_token>` (client-credentials grant) |
    | `Content-Type` | `application/json` (`application/x-www-form-urlencoded` on the token endpoint) |
    | `User-Agent` | any non-empty value; without it the network edge answers 403 with an HTML body |


    **Errors** - JSON with a fixed `error` text per status; rely on the status and `errorCode`, not
    on the text. Business refusals use status 467 and add `errorCode`, e.g.
    `{"error": "Some conditions were not met", "errorCode": "GI0023", "additionalData": {}}`.
    GI0021 (deeplink already used) and GI0022 (deeplink expired or unknown) are returned to the
    player who taps a link, never to the Game Studio. `503` means Sbarter is temporarily
    unavailable for your studio (not onboarded on this environment yet, or a Sbarter service is
    down or too slow); retry it later.


    **Retries** - retry `503` and network errors with a backoff; do not retry `400`, `401`, `403`,
    `404` or `467` without changing the request.

    | Call | Safe to retry? |
    |---|---|
    | `POST /v1/webhooks/game-studio/match-result` | Yes - `sessionId` + `matchId` is the key; a repeat is recognised, not applied twice |
    | `POST /v1/linking/in-app/{requestId}` | Yes - a request is decided once; a repeat of a finished request answers `409` |
    | `POST /v1/linking/deeplink/generate`, `POST /v1/challenges/deeplink/generate` | Each call mints a new link; retry only if you did not get one |
    | `GET` endpoints, `POST /v1/linking/status` | Yes - they change nothing |


    **Games, settings and challenges** - `GET /v1/games`, `GET /v1/games/{gameUUID}/settings`,
    `GET /v1/challenges` and `POST /v1/challenges/deeplink/generate` are being enabled studio by
    studio; ask Sbarter whether they are live for your slug. `GET /v1/games` returns Sbarter's own
    id for each of your games (`gameUUID`), which the settings and challenge endpoints use; it is
    not your `providerGameId`.


    Step-by-step flows with sequence diagrams: *In-App Linking Flow* and *Deep Link Flow* (links
    at the top of this page); challenge creation from the game is on *How Level 3 Works*.


    Every grant listed under OAuth2ClientCredentials is issued separately. A studio may hold one
    without the others, so check the `scope` claim of the token you were issued rather than
    assuming the full set.

servers:
  - url: https://partners.sbarter.com/{slug}
    description: Sbarter API - production
    variables:
      slug:
        default: your-slug
        description: The slug Sbarter assigned to your studio.
  - url: https://partners.test.sbarter.com/{slug}
    description: Sbarter API - staging
    variables:
      slug:
        default: your-slug
        description: The slug Sbarter assigned to your studio.
  - url: https://partners.dev.sbarter.com/{slug}
    description: Sbarter API - development
    variables:
      slug:
        default: your-slug
        description: The slug Sbarter assigned to your studio.
  - url: https://id.sbarter.com
    description: Sbarter Identity Provider - production
  - url: https://keycloak.test.sbarter.com
    description: Sbarter Identity Provider - staging
  - url: https://keycloak.dev.sbarter.com
    description: Sbarter Identity Provider - development

tags:
  - name: VGP - In App Confirmation
    description: Game Studio -> Sbarter for account linking result
  - name: VGP - DeepLink
    description: Game Studio -> Sbarter deep link generation (opens Sbarter mobile app)
  - name: VGP - Link Status
    description: Game Studio -> Sbarter lookup of whether one of its own accounts is linked
  - name: VGP - Games
    description: Game Studio -> Sbarter lookup of its own games and their challenge settings
  - name: VGP - Challenges
    description: Game Studio -> Sbarter lookup of the active challenges in its games
  - name: Webhook
    description: Game Studio -> Sbarter webhook endpoints (game results)
  - name: OAuth 2.0 Client Credentials
    description: Token issuance endpoint (Keycloak)

paths:
  /v1/auth/check:
    get:
      tags:
        - OAuth 2.0 Client Credentials
      summary: Check your credentials end to end
      operationId: checkStudioAuth
      description: >
        Answers 204 once the token is valid, belongs to the studio behind your slug and the gateway
        routes your slug. Call it once after onboarding and after rotating credentials; it changes
        nothing.


        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials: []
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      responses:
        "204":
          description: Credentials, studio and slug are all in place
        "401":
          description: Token missing, expired or not from the studio_investor realm of this environment
        "403":
          description: The token belongs to another studio, or the User-Agent header is missing (HTML body from the network edge)
        "404":
          description: Unknown slug
        "503":
          description: Your studio is not onboarded on this environment yet

  /v1/linking/in-app/{requestId}:
    post:
      tags:
        - VGP - In App Confirmation
      summary: Linking result (accepted/rejected/expired)
      operationId: postInAppLinkingResult
      description: >
        Game Studio calls this endpoint after the user confirms or rejects linking inside the game.
        This is the FINAL decision for the given requestId.
        When linking is accepted, the payload must include the verified
        provider profile snapshot captured at link time.

        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.write
      parameters:
        - name: requestId
          in: path
          required: true
          description: Linking request identifier (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/UserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InAppLinkingResultWebhook'
      responses:
        "202":
          description: Accepted for processing
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token is missing the linking.write scope, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "404":
          description: No linking request with this requestId for your studio
        "409":
          description: Request already processed (idempotency)
        "467":
          description: >-
            Business rule refusal; the reason is the errorCode in the response body.
            GI0023 - an accepted decision for a providerUserId that is already linked to another
            Sbarter user. A provider account can be linked to one Sbarter user at a time, so the
            request is recorded as rejected and the player's pending link is cleared. The account
            becomes free again once that player removes the game from their Sbarter library.
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later


  /v1/linking/deeplink/generate:
    post:
      tags:
        - VGP - DeepLink
      summary: Mint a linking deep link for one of the studio's players
      operationId: generateLinkingDeepLink
      description: >
        Called from inside the studio's own game, for a player who is logged in there. The studio
        is asserting two things by calling this: that providerUserId is one of its accounts, and
        that the returned link reaches that account's player and nobody else.


        That assertion is the studio's half of the ownership proof. The other half is the player
        tapping the link and authenticating with Sbarter, after which the game is added to their
        library. **There is no callback to the studio** - this flow does not use the in-app
        linking webhook, and nothing is sent back when the link is redeemed. To find out whether
        it worked, call [`POST /v1/linking/status`](/server/vgp-link-status).


        The studio is taken from the access token, never from the payload. There is no way to mint
        a link for another studio's account.


        The link is single-use and lives at most **15 minutes**. A later expiresAt is stored at
        that cap rather than refused, and an absent one defaults to it - read expiresAt in the
        response rather than assuming the requested value was kept. Mint the link when the player
        asks for it, not in advance.


        What the player sees: the deepLink is an https link
        (`https://connect.sbarter.com/linking/confirm/dl_...` in production,
        `connect.test.sbarter.com` on staging). It opens the Sbarter app when installed; otherwise a
        Sbarter page with your game and the store links, and the app picks the link up on first
        start after install. The app redeems it as soon as the player is signed in (login or
        registration first if needed) and shows "Game connected" with providerDisplayName. A
        refused redemption (expired, already used, account linked meanwhile, game already in the
        player's library, player not eligible) leaves the link unused and nothing linked - the
        studio sees it as `linked: false`. Full walkthrough: *Deep Link Flow* page.


        An optional destination can send the player to a Sbarter tournament or challenge after
        they confirm the link. Sbarter checks that the target exists, belongs to the resolved
        game, and is open for participation (a challenge waiting for an opponent and not expired;
        a tournament still open for registration). Without it, the normal post-linking journey
        applies. The resourceId is a Sbarter id: take a challenge id from `GET /v1/challenges`;
        there is no client-credentials endpoint to list tournaments yet, so take a tournament id
        from the Sbarter web portal or ask Sbarter.


        A `challenge` destination is for a player who is **already linked**: it opens that
        challenge for them, so the account must be linked first (otherwise 403). A private
        challenge can only be opened for a player who was invited to it (otherwise 403). A
        `tournament` destination works for a player who is not linked yet.


        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.deeplink.write
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepLinkGenerateRequest'
            example:
              providerGameId: "some-game-id"
              providerUserId: "user123456"
              providerDisplayName: "DragonSlayer42"
              destination:
                type: tournament
                resourceId: "00000000-0000-0000-0000-000000000101"
      responses:
        "201":
          description: Link minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepLinkGenerateResponse'
              example:
                linkId: "dl_7f3k9q2mwz8c4n6b"
                deepLink: "https://connect.sbarter.com/linking/confirm/dl_7f3k9q2mwz8c4n6b"
                expiresAt: "2025-12-12T13:00:00Z"
        "400":
          description: >-
            Invalid payload (including an unsupported destination type or invalid resourceId),
            an expiresAt already in the past, or a providerGameId that resolves only to the
            studio's default partner row and so does not identify one game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed, check additional_fields for details"
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token is missing the linking.deeplink.write scope; a challenge destination for an
            account that is not linked, or for a private challenge the player was not invited to;
            or the User-Agent header is missing or empty (rejected at the network edge with an HTML
            body)
        "404":
          description: >-
            No game of this studio has this providerGameId, or the optional destination is missing,
            belongs to another game, has expired, or is not open for participation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Not Found"
        "467":
          description: >-
            Business rule refusal; the reason is the errorCode in the response body.
            GI0023 - providerUserId is already linked to a Sbarter user, so no link is minted
            (except with a `challenge` destination, which needs a linked account).
            A provider account can be linked to one Sbarter user at a time; check it first with
            `POST /v1/linking/status`. Several links for one account that is not linked yet are
            allowed, but once one of them is redeemed the others are refused with the same code
            and stay unused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessErrorResponse'
              example:
                error: "Some conditions were not met"
                errorCode: "GI0023"
                additionalData: {}
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /v1/challenges/deeplink/generate:
    post:
      tags:
        - VGP - DeepLink
      summary: Mint a deep link that opens challenge creation, prefilled
      operationId: generateChallengeDeepLink
      description: >
        Called from inside the studio's own game when a player wants to start a Sbarter challenge
        from there. The player picks the format (one of the game's challenge settings), public or
        private, the pledge and how long the challenge stays open; the studio passes those here
        and hands the returned deepLink to the player. Opening it in the Sbarter app shows
        challenge creation with those values filled in; the player confirms it there. From then
        on it is the normal challenge match flow.


        The link is minted for one of the studio's accounts the same way as
        `POST /v1/linking/deeplink/generate` - the same assertion, the same single use, the same
        **15 minute** cap on expiresAt and the same GI0023 refusal - and the player links the
        account when they open it. There is no callback to the studio.


        Take gameSettingsId from `GET /v1/games/{gameUUID}/settings` and keep pledge and
        availability within that setting's limits (`pledge.min`..`pledge.max`,
        `challengeAvailableFor`). pledge is a non-negative decimal string with at most six
        fractional digits; availability is a non-negative integer string, in minutes.


        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.deeplink.write
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeDeepLinkGenerateRequest'
            example:
              providerGameId: "some-game-id"
              providerUserId: "user123456"
              providerDisplayName: "DragonSlayer42"
              gameSettingsId: "00000000-0000-0000-0000-000000000201"
              type: public
              pledge: "10.5"
              availability: "60"
      responses:
        "201":
          description: Link minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepLinkGenerateResponse'
              example:
                linkId: "dl_7f3k9q2mwz8c4n6b"
                deepLink: "https://connect.sbarter.com/linking/confirm/dl_7f3k9q2mwz8c4n6b"
                expiresAt: "2025-12-12T13:00:00Z"
        "400":
          description: >-
            Invalid payload (missing field, unsupported type, pledge or availability in a wrong
            format), or an expiresAt already in the past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed, check additional_fields for details"
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token is missing the linking.deeplink.write scope, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "404":
          description: No game of this studio matches providerGameId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Not Found"
        "467":
          description: >-
            Business rule refusal; the reason is the errorCode in the response body.
            GI0023 - providerUserId is already linked to a Sbarter user, so no link is minted.
            The account is free again once that player removes the game from their Sbarter
            library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessErrorResponse'
              example:
                error: "Some conditions were not met"
                errorCode: "GI0023"
                additionalData: {}
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /v1/linking/status:
    post:
      tags:
        - VGP - Link Status
      summary: Check whether one of the studio's accounts is linked
      operationId: getLinkingStatus
      description: >
        Deliberately not a user lookup. It answers about one of the **studio's own** accounts,
        keyed by the studio's providerUserId. There is no way to ask about a Sbarter account
        directly, and no way to enumerate.


        An account that is not linked, belongs to another studio, or does not exist all answer the
        same `{ "linked": false }` with status 200. That is not vagueness: splitting them into 404
        and 200 would let a caller discover which accounts Sbarter holds by reading status codes.


        This is how a studio learns a deep link worked, for both the deep link flow and the in-app
        flow. The player leaves the game to tap the link and comes back, so the natural moment to
        call this is when the game regains focus.


        POST rather than GET because the account identifier is a provider-side string that must
        not end up in a URL, where it would be logged by every proxy on the way.


        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.read
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkingStatusRequest'
            example:
              providerGameId: "some-game-id"
              providerUserId: "user123456"
      responses:
        "200":
          description: >-
            Link status. Also the answer for an unknown or foreign account, as `linked: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkingStatusResponse'
              examples:
                linked:
                  summary: Account is linked
                  value:
                    linked: true
                    nickname: "player_one"
                    avatar: "https://cdn.sbarter.com/avatars/player_one.png"
                    linkedAt: "2025-12-12T12:45:00Z"
                notLinked:
                  summary: Not linked, unknown, or another studio's account
                  value:
                    linked: false
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token is missing the linking.read scope, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /v1/games:
    get:
      tags:
        - VGP - Games
      summary: List the studio's games
      operationId: listStudioGames
      description: >
        Returns the calling studio's games with their Sbarter id, name and status, ordered by
        name. The studio is taken from the access token. Deleted games are never returned.
        Without a status filter every non-deleted game is returned; repeat `status` to ask for
        several (`?status=active&status=draft`).


        The `id` is Sbarter's own id for the game - the `gameUUID` of
        `GET /v1/games/{gameUUID}/settings`. It is not your `providerGameId`.


        Authorization: Bearer <access_token>. Any valid token of the studio; no extra scope.
      security:
        - OAuth2ClientCredentials: []
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          description: Only games in these statuses. Repeat the parameter for several.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GameStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/UserAgent'
      responses:
        "200":
          description: The studio's games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGamesResponse'
              example:
                games:
                  - id: "00000000-0000-0000-0000-000000000301"
                    name: "Some Game"
                    status: active
                pagination:
                  page: 1
                  perPage: 20
                  totalCount: 1
        "400":
          description: Invalid page, perPage or status
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token belongs to another studio, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /v1/games/{gameUUID}/settings:
    get:
      tags:
        - VGP - Games
      summary: List the challenge settings of one of the studio's games
      operationId: listGameSettings
      description: >
        Returns the challenge settings of a game: each setting is a challenge format with its
        pledge limits and the availability periods a challenge may stay open for. Deleted
        settings are not returned; the list is ordered by uuid.


        The `uuid` of a setting is the gameSettingsId of
        `POST /v1/challenges/deeplink/generate`. Settings change rarely; read them once and again
        when your game's configuration changes, not per player.


        Authorization: Bearer <access_token>. Any valid token of the studio; no extra scope.
      security:
        - OAuth2ClientCredentials: []
      parameters:
        - name: gameUUID
          in: path
          required: true
          description: Sbarter game id, the `id` from `GET /v1/games`.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/UserAgent'
      responses:
        "200":
          description: The game's challenge settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGameSettingsResponse'
              example:
                gameSettings:
                  - uuid: "00000000-0000-0000-0000-000000000201"
                    gameUUID: "00000000-0000-0000-0000-000000000301"
                    name: "Best of 1"
                    description: "One match, winner takes the pot"
                    status: "active"
                    challengeAvailableFor: [30, 60, 120]
                    pledge:
                      min: "1"
                      max: "100"
                pagination:
                  page: 1
                  perPage: 20
                  totalCount: 1
        "400":
          description: Invalid page, perPage or gameUUID
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token belongs to another studio, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "404":
          description: The game does not exist, is not available or belongs to another studio
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /v1/challenges:
    get:
      tags:
        - VGP - Challenges
      summary: List the active challenges in the studio's games
      operationId: listStudioChallenges
      description: >
        Lists the challenges in the calling studio's games that are still in play: only
        MATCHMAKING, AWAIT_GAME, PREPARING_FOR_GAME, IN_GAME and RESOLVE_RESULTS are returned. Each
        challenge comes with its participants. A challenge's `uuid` is what a `challenge`
        destination of `POST /v1/linking/deeplink/generate` takes.


        Ordered by createdAt DESC unless sortField / sortOrder say otherwise. Sorting by startAt
        or completedAt leaves out challenges without that timestamp.


        Pagination is by opaque cursors: pass `pagination.nextScrollID` (or `prevScrollID`) back
        as the URL-encoded `cursor` and keep the same filters and sort while following it. Array
        filters take comma-separated values, e.g.
        `?limit=20&statuses=MATCHMAKING,AWAIT_GAME&types=PUBLIC`. A gamerID filter leaves out
        participants whose outcome is LEAVE. All SBT amounts are decimal strings, to keep their
        precision.


        Authorization: Bearer <access_token>. Any valid token of the studio; no extra scope.
      security:
        - OAuth2ClientCredentials: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page (`nextScrollID` / `prevScrollID`).
          schema:
            type: string
        - name: limit
          in: query
          required: true
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: gamerID
          in: query
          required: false
          description: Only challenges this Sbarter player takes part in.
          schema:
            type: string
            format: uuid
        - name: challengeIDs
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: gameIDs
          in: query
          required: false
          style: form
          explode: false
          description: Sbarter game ids, the `id` from `GET /v1/games`.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: statuses
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChallengeStatus'
        - name: notInStatuses
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChallengeStatus'
        - name: types
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChallengeType'
        - name: availableFor
          in: query
          required: false
          style: form
          explode: false
          description: Availability periods, in minutes.
          schema:
            type: array
            items:
              type: integer
              minimum: 0
        - name: startedFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: completedTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          description: Challenge uuid.
          schema:
            type: string
        - name: sortField
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChallengeSortField'
        - name: sortOrder
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortOrder'
        - $ref: '#/components/parameters/UserAgent'
      responses:
        "200":
          description: Challenges with their participants, and the cursors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChallengesResponse'
        "400":
          description: Invalid filter, sort, limit or cursor
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token belongs to another studio, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /v1/webhooks/game-studio/match-result:
    post:
      tags:
        - Webhook
      summary: Receive match result webhook
      operationId: postMatchResultWebhook
      description: >
        Game Studio sends match results for a previously created 1v1 match/session.
        Retries are expected. Duplicate deliveries of the same logical result must be safe,
        using `sessionId + matchId` as the idempotency key.
        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - webhook.write
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameResultWebhookPayload'
      responses:
        "202":
          description: Webhook accepted, including safe duplicate retries
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: >-
            The token is missing the webhook.write scope, or the User-Agent header is missing or empty (rejected at the network edge with an HTML body)
        "404":
          description: No session with this sessionId for your studio
        "500":
          description: Internal server error
        "503":
          description: Temporarily unavailable - retry later

  /realms/studio_investor/protocol/openid-connect/token:
    post:
      security: []
      servers:
        - url: https://keycloak.dev.sbarter.com
          description: Development identity provider
        - url: https://keycloak.test.sbarter.com
          description: Staging identity provider
        - url: https://id.sbarter.com
          description: Production identity provider
      tags:
        - OAuth 2.0 Client Credentials
      summary: Obtain Access Token (Client Credentials)
      operationId: obtainClientCredentialsToken
      description: |-
        Obtain a short-lived OAuth 2.0 access token for calls from your VGP backend
        to the Sbarter Game Integration API.

        **Authentication flow:** `client_credentials`. You must first create your `client_id` 
        and `client_secret` through the Studio Web Portal.

        **Request encoding:** send an HTTP `POST` with
        `Content-Type: application/x-www-form-urlencoded`. Do not send JSON,
        multipart form-data, or quote the form values. A missing or incorrectly
        encoded `grant_type` produces an OAuth `invalid_request` error.

        **Client authentication:** the example sends `client_id` and `client_secret`
        in the form body (`client_secret_post`). Whether HTTP Basic
        (`client_secret_basic`) is available depends on the client configuration.
        Always use HTTPS and keep the client secret server-side.

        **Expiry:** `expires_in` is the access token's remaining lifetime **in
        seconds from issuance**, not an absolute timestamp. For example,
        `expires_in: 300` means the token expires in approximately **5 minutes**.
        Cache and reuse the token until shortly before expiry (allowing for
        network delay and clock skew), then request a new access token. Do not
        request a token for every API call. The Client Credentials flow does not
        require or normally return a refresh token.

        **Using the token:** send `Authorization: Bearer <access_token>` on
        subsequent Sbarter API calls. The `scope` response field, when present,
        is a space-separated string of scopes actually granted to the client;
        do not assume every scope listed in this specification is granted.

        **Troubleshooting:** OAuth validation errors typically return JSON with
        `error` and `error_description`. A generic HTML `403` response
        may instead originate from an upstream load balancer, proxy, or WAF;
        examine response headers and infrastructure logs.
      parameters:
        - $ref: '#/components/parameters/UserAgent'
      requestBody:
        required: true
        description: Form-encoded OAuth Client Credentials token request. All three fields are required.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
            encoding:
              grant_type:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
            examples:
              client_credentials:
                summary: Staging client credentials request (replace placeholders)
                value:
                  grant_type: client_credentials
                  client_id: YOUR_CLIENT_ID
                  client_secret: YOUR_CLIENT_SECRET
      responses:
        "200":
          description: |-
            Access token issued. `expires_in` is measured in **seconds**;
            `300` indicates a **five-minute** lifetime, not 300 milliseconds
            or an absolute time. Token lifetime and granted scopes are server-configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                ok:
                  summary: Example token response (illustrative)
                  value:
                    access_token: eyJ...REDACTED
                    token_type: Bearer
                    expires_in: 300
                    scope: linking.read
        "400":
          description: |-
            Invalid or incorrectly encoded request, for example a missing
            `grant_type` form field or unsupported grant type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenError'
              examples:
                missing_grant_type:
                  summary: Missing form-encoded grant_type
                  value:
                    error: invalid_request
                    error_description: 'Missing form parameter: grant_type'
                unsupported_grant_type:
                  summary: Unsupported or disallowed grant type (illustrative)
                  value:
                    error: unsupported_grant_type
        "401":
          description: Invalid client authentication, such as an unknown client or incorrect secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenError'
              examples:
                invalid_client:
                  value:
                    error: invalid_client
                    error_description: Invalid client credentials
        "403":
          description: |-
            Request forbidden by the identity provider or an upstream access-control
            layer. A proxy, ALB, or WAF may return HTML instead of an OAuth JSON error.
            The most common cause is a missing or empty `User-Agent` header: the Sbarter
            network edge rejects such requests with an HTML `403` before they reach the
            identity provider. Always send a `User-Agent` (see the parameter above).
        "429":
          description: Too many token requests; reduce request frequency and apply backoff. Exact rate limits are not specified.
        "500":
          description: Identity provider or upstream server error; retry with bounded exponential backoff.

components:
  parameters:
    UserAgent:
      name: User-Agent
      in: header
      required: true
      description: >-
        Any non-empty value that identifies your client. Requests without a User-Agent header, or
        with an empty one, are rejected at the Sbarter network edge with 403 Forbidden and an HTML
        body, before they reach the token endpoint or the API. Most HTTP clients send one by
        default; set it explicitly if yours strips default headers.
      schema:
        type: string
        minLength: 1
      example: <studio>-backend/1.0

    Page:
      name: page
      in: query
      required: true
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1

    PerPage:
      name: perPage
      in: query
      required: true
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100

  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials Grant used by Game Studio when calling Sbarter webhooks.
        clientId/clientSecret are managed in Keycloak and bound to a specific studio/game.
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.test.sbarter.com/realms/studio_investor/protocol/openid-connect/token
          scopes:
            linking.write: Send in-app linking result to Sbarter.
            linking.deeplink.write: Generate linking deep links.
            linking.read: Read the link status of the studio's own provider accounts.
            webhook.write: Send match result webhooks to Sbarter.

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      description: >-
        Error body for 400, 401, 403 (JSON ones), 404, 409 and 500. The text is fixed per status;
        do not parse it.
      properties:
        error:
          type: string
          example: "Not Found"

    BusinessErrorResponse:
      type: object
      required: [error, errorCode]
      description: Error body for 467 - a business rule refused the request; errorCode says which.
      properties:
        error:
          type: string
          example: "Some conditions were not met"
        errorCode:
          type: string
          description: >-
            Machine-readable reason. GI0023 - the provider account is already linked to a Sbarter
            player.
          example: "GI0023"
        additionalData:
          type: object
          additionalProperties: {}
          description: Optional details for the code; may be empty.

    InAppLinkingResultWebhook:
      oneOf:
        - $ref: '#/components/schemas/InAppLinkingResultAcceptedWebhook'
        - $ref: '#/components/schemas/InAppLinkingResultRejectedWebhook'
        - $ref: '#/components/schemas/InAppLinkingResultExpiredWebhook'
      discriminator:
        propertyName: status
        mapping:
          accepted: '#/components/schemas/InAppLinkingResultAcceptedWebhook'
          rejected: '#/components/schemas/InAppLinkingResultRejectedWebhook'
          expired: '#/components/schemas/InAppLinkingResultExpiredWebhook'

    InAppLinkingResultAcceptedWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt, providerDisplayName, profileCapturedAt, profileStats]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was verified during linking. This is not necessarily the player's display name.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the verified provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        providerDisplayName:
          type: string
          description: Verified human-readable provider display name captured at link time.
          example: "PlayerOne"
        status:
          type: string
          enum: [accepted]
          example: "accepted"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T12:45:10Z"
        profileCapturedAt:
          type: string
          format: date-time
          description: Timestamp at which the provider profile snapshot was captured.
          example: "2025-12-12T12:44:58Z"
        profileStats:
          $ref: '#/components/schemas/ProfileStats'

    InAppLinkingResultRejectedWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was targeted for verification.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        status:
          type: string
          enum: [rejected]
          example: "rejected"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T12:45:10Z"

    InAppLinkingResultExpiredWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was targeted for verification.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        status:
          type: string
          enum: [expired]
          example: "expired"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T13:00:00Z"

    GameResultStatus:
      type: string
      enum: [win, draw, failed, voided]

    PlayerGameResult:
      type: object
      required: [providerUserId, internalId, outcome]
      properties:
        providerUserId:
          type: string
          description: Stable provider-side account identifier for this player. This is not necessarily the player's display name.
          example: "Player#1234"
        internalId:
          type: string
          nullable: true
          description: >-
            Sbarter internal player identifier used to map provider-side players back to the
            correct Sbarter user - the internalId Sbarter sent for this player in
            `POST /v1/session`. A reported win without it is refused.
          example: "sbarter-user-12345"
        outcome:
          type: string
          enum: [win, loss, draw]
          example: "win"

    GameResultWebhookPayload:
      type: object
      required: [providerGameId, sessionId, matchId, status, players]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "chess game"
        sessionId:
          type: string
          format: uuid
          description: Canonical Sbarter session identifier. Together with `matchId`, this forms the idempotency key for retries.
          example: "123e4567-e89b-12d3-a456-426614174000"
        matchId:
          type: string
          description: Provider-side contest identifier associated with the reported result.
          example: "contest-abc-123"
        status:
          $ref: '#/components/schemas/GameResultStatus'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional provider-side match start timestamp.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional provider-side match completion timestamp.
        players:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly two player result entries for the current 1v1 contest flow.
          items:
            $ref: '#/components/schemas/PlayerGameResult'

    ProfileStats:
      type: object
      description: Generic provider-defined profile metrics captured at link time. Keep provider-specific metrics inside this object rather than promoting them to shared top-level fields.
      additionalProperties: {}
      example:
        current_trophies: 5123
        best_trophies: 5400
        ranked_rating: 1675

    ClientCredentialsTokenRequest:
      type: object
      description: |-
        OAuth 2.0 Client Credentials request. Serialize all properties as
        `application/x-www-form-urlencoded`, not JSON. The client ID and secret
        are created and managed in the Studio Web Portal.
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: |-
            OAuth grant to request. For the VGP backend integration this must
            be exactly `client_credentials` (no quotation marks).
          example: client_credentials
        client_id:
          type: string
          minLength: 1
          description: Public identifier for the authorised VGP OAuth client; generated in the Studio Web Portal.
          example: YOUR_CLIENT_ID
        client_secret:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: |-
            Confidential VGP OAuth client secret. Displayed once on creation;
            store securely on your backend and never publish or embed in client code.
          example: YOUR_CLIENT_SECRET

    TokenResponse:
      type: object
      description: |-
        Successful OAuth 2.0 token response. Token lifetimes and granted scopes
        depend on server/client policy. Do not hard-code the example values.
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |-
            Short-lived bearer access token. Present it in the HTTP header
            `Authorization: Bearer <access_token>` when calling Sbarter APIs.
            Treat the token as a secret and do not log it.
          example: eyJ...REDACTED
        token_type:
          type: string
          enum: [Bearer]
          description: |-
            OAuth token type. `Bearer` means possession of the token is
            sufficient to authenticate a protected API request.
          example: Bearer
        expires_in:
          type: integer
          format: int32
          minimum: 0
          description: |-
            **Access token lifetime in seconds**, counted from token issuance.
            Example: `300` = **300 seconds = 5 minutes**. This is a relative
            lifetime, not a Unix timestamp or milliseconds. Cache the token,
            renew shortly before expiry and do not assume every issued token
            has the example lifetime.
          example: 300
        scope:
          type: string
          description: |-
            Space-separated list of OAuth scopes actually granted, when
            included in the response, for example `linking.read webhook.write`.
            The list can differ from the scopes configured in the specification.
          example: linking.read
    OAuthTokenError:
      type: object
      description: |-
        OAuth-style JSON error returned by the token endpoint. Depending on
        the infrastructure, some HTTP errors may instead contain plain HTML.
      required: [error]
      properties:
        error:
          type: string
          description: OAuth error identifier, for example `invalid_request`, `invalid_client` or `unsupported_grant_type`.
          example: invalid_request
        error_description:
          type: string
          description: Optional human-readable explanation intended for debugging; do not rely on its exact wording.
          example: 'Missing form parameter: grant_type'
        error_uri:
          type: string
          format: uri
          description: Optional URL providing further details about the error.

    DeepLinkGenerateRequest:
      type: object
      required: [providerGameId, providerUserId]
      properties:
        providerGameId:
          type: string
          description: >-
            Your id for the game, as Sbarter registered it on your studio's partner configuration
            (set by Sbarter, not shown in the web portal; ask Sbarter). Not the game name. Resolved
            to a Sbarter game here, so an id that is not configured is a 404 rather than a link
            that cannot be redeemed.
          example: "some-game-id"
        providerUserId:
          type: string
          description: >-
            Stable provider-side account identifier the link will link. Not necessarily the
            player's display name.
          example: "user123456"
        providerDisplayName:
          type: string
          description: >-
            Human-readable provider display name. Strongly recommended: it is what the player is
            shown on the confirmation screen, and it is their only way to notice that a link which
            reached them belongs to somebody else. Without it the screen can show only the raw
            account id.
          example: "DragonSlayer42"
        expiresAt:
          type: string
          format: date-time
          description: >-
            Requested deadline. Optional. Capped at 15 minutes from now and defaulted to that when
            absent; a value already in the past is refused with 400. Read expiresAt in the
            response to see what was actually stored.
          example: "2025-12-12T13:00:00Z"
        destination:
          $ref: '#/components/schemas/DeepLinkDestination'

    DeepLinkDestination:
      type: object
      description: >-
        Optional Sbarter navigation target after the player confirms the link. Sbarter checks
        that the target exists, belongs to the resolved game, and is open for participation.
      required: [type, resourceId]
      properties:
        type:
          type: string
          enum: [tournament, challenge]
        resourceId:
          type: string
          format: uuid
          description: Sbarter tournament or challenge UUID, matching type; not a provider-side ID.

    DeepLinkGenerateResponse:
      type: object
      required: [linkId, deepLink, expiresAt]
      properties:
        linkId:
          type: string
          description: Opaque single-use identifier. Not a uuid; treat it as an opaque string.
          example: "dl_7f3k9q2mwz8c4n6b"
        deepLink:
          type: string
          description: >-
            The link to hand to the player. Hand it over whole - it must not be rebuilt from
            linkId, and its form is environment-specific. In production it is an https universal
            link, which opens the Sbarter app when installed and otherwise a page that leads to
            the app store.
          example: "https://connect.sbarter.com/linking/confirm/dl_7f3k9q2mwz8c4n6b"
        expiresAt:
          type: string
          format: date-time
          description: The deadline actually stored, after Sbarter's cap was applied.
          example: "2025-12-12T13:00:00Z"

    LinkingStatusRequest:
      type: object
      required: [providerGameId, providerUserId]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier, as registered on the partner configuration.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier to ask about.
          example: "user123456"

    LinkingStatusResponse:
      type: object
      required: [linked]
      properties:
        linked:
          type: boolean
          description: >-
            Whether this provider account is linked to a Sbarter account in one of the studio's
            games. False also covers accounts that are unknown or belong to another studio.
          example: true
        nickname:
          type: string
          description: The player's public Sbarter nickname. Present only when linked.
          example: "player_one"
        avatar:
          type: string
          description: URL of the player's public Sbarter avatar, when they have one.
          example: "https://cdn.sbarter.com/avatars/player_one.png"
        linkedAt:
          type: string
          format: date-time
          description: When the link was established. Present only when linked.
          example: "2025-12-12T12:45:00Z"

    ChallengeDeepLinkGenerateRequest:
      type: object
      required: [providerGameId, providerUserId, gameSettingsId, type, pledge, availability]
      properties:
        providerGameId:
          type: string
          minLength: 1
          description: >-
            Your id for the game, as Sbarter registered it on your studio's partner configuration.
            Same as in `POST /v1/linking/deeplink/generate`.
          example: "some-game-id"
        providerUserId:
          type: string
          minLength: 1
          description: Stable provider-side account identifier of the player creating the challenge.
          example: "user123456"
        providerDisplayName:
          type: string
          description: >-
            Human-readable provider display name, shown to the player when the link is opened.
            Strongly recommended.
          example: "DragonSlayer42"
        expiresAt:
          type: string
          format: date-time
          description: >-
            Requested deadline. Optional. Capped at 15 minutes from now and defaulted to that when
            absent; a value already in the past is refused with 400.
          example: "2025-12-12T13:00:00Z"
        gameSettingsId:
          type: string
          format: uuid
          description: The challenge format - a `uuid` from `GET /v1/games/{gameUUID}/settings`.
          example: "00000000-0000-0000-0000-000000000201"
        type:
          type: string
          enum: [public, private]
          description: Public challenges are open to any player; private ones only to invited players.
          example: public
        pledge:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: >-
            The creator's pledge in SBT. Non-negative decimal string with at most six fractional
            digits, within the setting's `pledge.min`..`pledge.max`.
          example: "10.5"
        availability:
          type: string
          pattern: '^[0-9]+$'
          description: >-
            How long the challenge stays open, in minutes. Non-negative integer string; one of the
            setting's `challengeAvailableFor` values.
          example: "60"

    GameStatus:
      type: string
      enum: [active, inactive, draft]
      description: Only active games are open to players.

    StudioGame:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
          description: Sbarter game id - the gameUUID of the settings endpoint. Not your providerGameId.
          example: "00000000-0000-0000-0000-000000000301"
        name:
          type: string
          example: "Some Game"
        status:
          $ref: '#/components/schemas/GameStatus'

    Pagination:
      type: object
      required: [page, perPage, totalCount]
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        totalCount:
          type: integer
          description: Number of items across all pages.
          example: 1

    ListGamesResponse:
      type: object
      required: [games, pagination]
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/StudioGame'
        pagination:
          $ref: '#/components/schemas/Pagination'

    GameSettings:
      type: object
      required: [uuid, gameUUID, name, description, status, challengeAvailableFor, pledge]
      properties:
        uuid:
          type: string
          format: uuid
          description: Setting id - the gameSettingsId of `POST /v1/challenges/deeplink/generate`.
          example: "00000000-0000-0000-0000-000000000201"
        gameUUID:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000301"
        name:
          type: string
          example: "Best of 1"
        description:
          type: string
          example: "One match, winner takes the pot"
        status:
          type: string
          example: "active"
        challengeAvailableFor:
          type: array
          description: The periods, in minutes, a challenge of this format may stay open for.
          items:
            type: integer
          example: [30, 60, 120]
        pledge:
          $ref: '#/components/schemas/GameSettingsPledge'

    GameSettingsPledge:
      type: object
      required: [min, max]
      description: Pledge limits in SBT, as decimal strings.
      properties:
        min:
          type: string
          example: "1"
        max:
          type: string
          example: "100"

    ListGameSettingsResponse:
      type: object
      required: [gameSettings, pagination]
      properties:
        gameSettings:
          type: array
          items:
            $ref: '#/components/schemas/GameSettings'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ChallengeStatus:
      type: string
      enum: [MATCHMAKING, AWAIT_GAME, PREPARING_FOR_GAME, IN_GAME, RESOLVE_RESULTS]

    ChallengeType:
      type: string
      enum: [PUBLIC, PRIVATE]

    ChallengeSortField:
      type: string
      enum: [uuid, createdAt, startAt, completedAt, pledgeSBT, potentialWinSBT, game]

    SortOrder:
      type: string
      enum: [ASC, DESC]

    ParticipantOutcome:
      type: string
      enum: [WIN, LOSS, DRAW, FAIL, CANCELLED, VOIDED, LEAVE]

    CursorPagination:
      type: object
      required: [hasNext, hasPrev, nextScrollID, prevScrollID]
      properties:
        nextScrollID:
          type: string
          description: Cursor for the next page; pass it as `cursor`.
        prevScrollID:
          type: string
          description: Cursor for the previous page; pass it as `cursor`.
        hasNext:
          type: boolean
          description: Whether a next page exists.
        hasPrev:
          type: boolean
          description: Whether a previous page exists.

    ListChallengesResponse:
      type: object
      required: [challenges, pagination]
      properties:
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/StudioChallenge'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    StudioChallenge:
      type: object
      required: [uuid, authorUUID, gameUUID, gameName, gameSettingsUUID, status, type, pledgeSBT, feeSBT, totalPledgeSBT, potentialWinSBT, availableFor, expireAt, createdAt, updatedAt, participants]
      properties:
        uuid:
          type: string
          format: uuid
          description: Sbarter challenge id - the resourceId of a `challenge` deep link destination.
        authorUUID:
          type: string
          format: uuid
          description: Sbarter player who created the challenge.
        gameUUID:
          type: string
          format: uuid
        gameName:
          type: string
        gameSettingsUUID:
          type: string
          format: uuid
        sessionUUID:
          type: string
          format: uuid
          description: Sbarter session id, present once the match is registered.
        status:
          $ref: '#/components/schemas/ChallengeStatus'
        type:
          $ref: '#/components/schemas/ChallengeType'
        pledgeSBT:
          type: string
        feeSBT:
          type: string
        totalPledgeSBT:
          type: string
        potentialWinSBT:
          type: string
        availableFor:
          type: integer
          description: Minutes the challenge stays open.
        expireAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: '#/components/schemas/StudioChallengeParticipant'

    StudioChallengeParticipant:
      type: object
      required: [gamerUUID, pledgeSBT, feeSBT, updatedAt]
      properties:
        gamerUUID:
          type: string
          format: uuid
          description: Sbarter player id.
        pledgeSBT:
          type: string
        feeSBT:
          type: string
        outcome:
          $ref: '#/components/schemas/ParticipantOutcome'
        balanceChangeSBT:
          type: string
        readyAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
