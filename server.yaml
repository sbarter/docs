openapi: 3.0.3
info:
  title: Sbarter API - Game Studio Integration (Server Implementation)
  version: 1.0.0
  description: >
    This OpenAPI describes the endpoints exposed by Sbarter that the Game Studio calls:

    - In-app linking result webhook

    - Linking deep link generation

    - Linking status lookup

    - Match result webhooks


    It also documents the OAuth2 Client Credentials token endpoint (Keycloak).


    Every grant listed under OAuth2ClientCredentials is issued separately. A studio may hold one
    without the others, so check the `scope` claim of the token you were issued rather than
    assuming the full set.

servers:
  - url: https://webhook.dev.sbarter.com
    description: Sbarter API
  - url: https://keycloak.dev.sbarter.com
    description: Sbarter Identity Provider (Keycloak)

tags:
  - name: VGP - In App Confirmation
    description: Game Studio -> Sbarter for account linking result
  - name: VGP - DeepLink
    description: Game Studio -> Sbarter deep link generation (opens Sbarter mobile app)
  - name: VGP - Link Status
    description: Game Studio -> Sbarter lookup of whether one of its own accounts is linked
  - name: Webhook
    description: Game Studio -> Sbarter webhook endpoints (game results)
  - name: OAuth 2.0 Client Credentials
    description: Token issuance endpoint (Keycloak)

paths:
  /v1/linking/in-app/{requestId}:
    post:
      tags:
        - VGP - In App Confirmation
      summary: Linking result (accepted/rejected/expired)
      operationId: postInAppLinkingResult
      description: >
        Game Studio calls this endpoint after the user confirms or rejects linking inside the game.
        This is the FINAL decision for the given requestId.
        When linking is accepted, the payload must include the verified
        provider profile snapshot captured at link time.

        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.write
      parameters:
        - name: requestId
          in: path
          required: true
          description: Linking request identifier (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InAppLinkingResultWebhook'
      responses:
        "202":
          description: Accepted for processing
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Forbidden
        "409":
          description: Request already processed (idempotency)
        "500":
          description: Internal server error


  /v1/linking/deeplink/generate:
    post:
      tags:
        - VGP - DeepLink
      summary: Mint a linking deep link for one of the studio's players
      operationId: generateLinkingDeepLink
      description: >
        Called from inside the studio's own game, for a player who is logged in there. The studio
        is asserting two things by calling this: that providerUserId is one of its accounts, and
        that the returned link reaches that account's player and nobody else.


        That assertion is the studio's half of the ownership proof. The other half is the player
        tapping the link and authenticating with Sbarter, after which the game is added to their
        library. **There is no callback to the studio** - this flow does not use the in-app
        linking webhook, and nothing is sent back when the link is redeemed. To find out whether
        it worked, call [`POST /v1/linking/status`](/server/vgp-link-status).


        The studio is taken from the access token, never from the payload. There is no way to mint
        a link for another studio's account.


        The link is single-use. Its deadline is capped by Sbarter, so an expiresAt further out
        than the cap is stored at the cap rather than refused - read expiresAt in the response
        rather than assuming the requested value was kept.


        An optional destination can send the player to a Sbarter tournament or challenge after
        they confirm the link. Sbarter checks that the target exists, belongs to the resolved
        game, and is open for participation. Without it, the normal post-linking journey applies.


        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.deeplink.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepLinkGenerateRequest'
            example:
              providerGameId: "some-game-id"
              providerUserId: "user123456"
              providerDisplayName: "DragonSlayer42"
              destination:
                type: tournament
                resourceId: "00000000-0000-0000-0000-000000000101"
      responses:
        "201":
          description: Link minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepLinkGenerateResponse'
              example:
                linkId: "dl_7f3k9q2mwz8c4n6b"
                deepLink: "https://sbarter.kinsta.cloud/linking/confirm/dl_7f3k9q2mwz8c4n6b"
                expiresAt: "2025-12-12T13:00:00Z"
        "400":
          description: >-
            Invalid payload (including an unsupported destination type or invalid resourceId),
            an expiresAt already in the past, or a providerGameId that resolves only to the
            studio's default partner row and so does not identify one game
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Token is missing the linking.deeplink.write scope
        "404":
          description: >-
            No game of this studio contests providerGameId, or the optional destination is missing,
            belongs to another game, has expired, or is not open for participation
        "500":
          description: Internal server error

  /v1/linking/status:
    post:
      tags:
        - VGP - Link Status
      summary: Check whether one of the studio's accounts is linked
      operationId: getLinkingStatus
      description: >
        Deliberately not a user lookup. It answers about one of the **studio's own** accounts,
        keyed by the studio's providerUserId. There is no way to ask about a Sbarter account
        directly, and no way to enumerate.


        An account that is not linked, belongs to another studio, or does not exist all answer the
        same `{ "linked": false }` with status 200. That is not vagueness: splitting them into 404
        and 200 would let a caller discover which accounts Sbarter holds by reading status codes.


        This is how a studio learns a deep link worked, for both the deep link flow and the in-app
        flow. The player leaves the game to tap the link and comes back, so the natural moment to
        call this is when the game regains focus.


        POST rather than GET because the account identifier is a provider-side string that must
        not end up in a URL, where it would be logged by every proxy on the way.


        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - linking.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkingStatusRequest'
            example:
              providerGameId: "some-game-id"
              providerUserId: "user123456"
      responses:
        "200":
          description: >-
            Link status. Also the answer for an unknown or foreign account, as `linked: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkingStatusResponse'
              examples:
                linked:
                  summary: Account is linked
                  value:
                    linked: true
                    nickname: "player_one"
                    avatar: "https://cdn.sbarter.com/avatars/player_one.png"
                    linkedAt: "2025-12-12T12:45:00Z"
                notLinked:
                  summary: Not linked, unknown, or another studio's account
                  value:
                    linked: false
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Token is missing the linking.read scope
        "500":
          description: Internal server error

  /v1/webhooks/game-studio/match-result:
    post:
      tags:
        - Webhook
      summary: Receive match result webhook
      operationId: postMatchResultWebhook
      description: >
        Game Studio sends match results for a previously created 1v1 match/session.
        Retries are expected. Duplicate deliveries of the same logical result must be safe,
        using `sessionId + matchId` as the idempotency key.
        Authorization: Bearer <access_token>
      security:
        - OAuth2ClientCredentials:
            - webhook.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameResultWebhookPayload'
      responses:
        "202":
          description: Webhook accepted, including safe duplicate retries
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid OAuth2 token
        "403":
          description: Forbidden
        "500":
          description: Internal server error

  /realms/studio_investor/protocol/openid-connect/token:
    post:
      security: []
      servers:
        - url: https://keycloak.test.sbarter.com
          description: Staging identity provider (confirmed)
      tags:
        - OAuth 2.0 Client Credentials
      summary: Obtain Access Token (Client Credentials)
      operationId: obtainClientCredentialsToken
      description: |-
        Obtain a short-lived OAuth 2.0 access token for calls from your VGP backend
        to the Sbarter Game Integration API.

        **Authentication flow:** `client_credentials`. You must first create your `client_id` 
        and `client_secret` through the VGP Portal.

        **Request encoding:** send an HTTP `POST` with
        `Content-Type: application/x-www-form-urlencoded`. Do not send JSON,
        multipart form-data, or quote the form values. A missing or incorrectly
        encoded `grant_type` produces an OAuth `invalid_request` error.

        **Client authentication:** the example sends `client_id` and `client_secret`
        in the form body (`client_secret_post`). Whether HTTP Basic
        (`client_secret_basic`) is available depends on the client configuration.
        Always use HTTPS and keep the client secret server-side.

        **Expiry:** `expires_in` is the access token's remaining lifetime **in
        seconds from issuance**, not an absolute timestamp. For example,
        `expires_in: 300` means the token expires in approximately **5 minutes**.
        Cache and reuse the token until shortly before expiry (allowing for
        network delay and clock skew), then request a new access token. Do not
        request a token for every API call. The Client Credentials flow does not
        require or normally return a refresh token.

        **Using the token:** send `Authorization: Bearer <access_token>` on
        subsequent Sbarter API calls. The `scope` response field, when present,
        is a space-separated string of scopes actually granted to the client;
        do not assume every scope listed in this specification is granted.

        **Troubleshooting:** OAuth validation errors typically return JSON with
        `error` and `error_description`. A generic HTML `403` response
        may instead originate from an upstream load balancer, proxy, or WAF;
        examine response headers and infrastructure logs.
      requestBody:
        required: true
        description: Form-encoded OAuth Client Credentials token request. All three fields are required.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
            encoding:
              grant_type:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
            examples:
              client_credentials:
                summary: Staging client credentials request (replace placeholders)
                value:
                  grant_type: client_credentials
                  client_id: YOUR_CLIENT_ID
                  client_secret: YOUR_CLIENT_SECRET
      responses:
        "200":
          description: |-
            Access token issued. `expires_in` is measured in **seconds**;
            `300` indicates a **five-minute** lifetime, not 300 milliseconds
            or an absolute time. Token lifetime and granted scopes are server-configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                ok:
                  summary: Example token response (illustrative)
                  value:
                    access_token: eyJ...REDACTED
                    token_type: Bearer
                    expires_in: 300
                    scope: linking.read
        "400":
          description: |-
            Invalid or incorrectly encoded request, for example a missing
            `grant_type` form field or unsupported grant type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenError'
              examples:
                missing_grant_type:
                  summary: Missing form-encoded grant_type
                  value:
                    error: invalid_request
                    error_description: 'Missing form parameter: grant_type'
                unsupported_grant_type:
                  summary: Unsupported or disallowed grant type (illustrative)
                  value:
                    error: unsupported_grant_type
        "401":
          description: Invalid client authentication, such as an unknown client or incorrect secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenError'
              examples:
                invalid_client:
                  value:
                    error: invalid_client
                    error_description: Invalid client credentials
        "403":
          description: |-
            Request forbidden by the identity provider or an upstream access-control
            layer. A proxy, ALB, or WAF may return HTML instead of an OAuth JSON error.
        "429":
          description: Too many token requests; reduce request frequency and apply backoff. Exact rate limits are not specified.
        "500":
          description: Identity provider or upstream server error; retry with bounded exponential backoff.

components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials Grant used by Game Studio when calling Sbarter webhooks.
        clientId/clientSecret are managed in Keycloak and bound to a specific studio/game.
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.test.sbarter.com/realms/studio_investor/protocol/openid-connect/token
          scopes:
            linking.write: Send in-app linking result to Sbarter.
            linking.deeplink.write: Generate linking deep links.
            linking.read: Read the link status of the studio's own provider accounts.
            webhook.write: Send match result webhooks to Sbarter.

  schemas:
    InAppLinkingResultWebhook:
      oneOf:
        - $ref: '#/components/schemas/InAppLinkingResultAcceptedWebhook'
        - $ref: '#/components/schemas/InAppLinkingResultRejectedWebhook'
        - $ref: '#/components/schemas/InAppLinkingResultExpiredWebhook'
      discriminator:
        propertyName: status
        mapping:
          accepted: '#/components/schemas/InAppLinkingResultAcceptedWebhook'
          rejected: '#/components/schemas/InAppLinkingResultRejectedWebhook'
          expired: '#/components/schemas/InAppLinkingResultExpiredWebhook'

    InAppLinkingResultAcceptedWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt, providerDisplayName, profileCapturedAt, profileStats]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was verified during linking. This is not necessarily the player's display name.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the verified provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        providerDisplayName:
          type: string
          description: Verified human-readable provider display name captured at link time.
          example: "PlayerOne"
        status:
          type: string
          enum: [accepted]
          example: "accepted"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T12:45:10Z"
        profileCapturedAt:
          type: string
          format: date-time
          description: Timestamp at which the provider profile snapshot was captured.
          example: "2025-12-12T12:44:58Z"
        profileStats:
          $ref: '#/components/schemas/ProfileStats'

    InAppLinkingResultRejectedWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was targeted for verification.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        status:
          type: string
          enum: [rejected]
          example: "rejected"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T12:45:10Z"

    InAppLinkingResultExpiredWebhook:
      type: object
      required: [providerGameId, providerUserId, internalId, status, confirmedAt]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier that was targeted for verification.
          example: "user123456"
        internalId:
          type: string
          description: Sbarter internal player identifier used to map the provider-side account back to the correct Sbarter user.
          example: "sbarter-12345-kudos"
        status:
          type: string
          enum: [expired]
          example: "expired"
        confirmedAt:
          type: string
          format: date-time
          description: Timestamp at which the partner reached the final linking decision.
          example: "2025-12-12T13:00:00Z"

    GameResultStatus:
      type: string
      enum: [win, draw, failed, voided]

    PlayerGameResult:
      type: object
      required: [providerUserId, internalId, outcome]
      properties:
        providerUserId:
          type: string
          description: Stable provider-side account identifier for this player. This is not necessarily the player's display name.
          example: "Player#1234"
        internalId:
          type: string
          nullable: true
          description: Sbarter internal player identifier used to map provider-side players back to the correct Sbarter user.
          example: "sbarter-user-12345"
        outcome:
          type: string
          enum: [win, loss, draw]
          example: "win"

    GameResultWebhookPayload:
      type: object
      required: [providerGameId, sessionId, matchId, status, players]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier.
          example: "chess game"
        sessionId:
          type: string
          format: uuid
          description: Canonical Sbarter session identifier. Together with `matchId`, this forms the idempotency key for retries.
          example: "123e4567-e89b-12d3-a456-426614174000"
        matchId:
          type: string
          description: Provider-side contest identifier associated with the reported result.
          example: "contest-abc-123"
        status:
          $ref: '#/components/schemas/GameResultStatus'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional provider-side match start timestamp.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional provider-side match completion timestamp.
        players:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly two player result entries for the current 1v1 contest flow.
          items:
            $ref: '#/components/schemas/PlayerGameResult'

    ProfileStats:
      type: object
      description: Generic provider-defined profile metrics captured at link time. Keep provider-specific metrics inside this object rather than promoting them to shared top-level fields.
      additionalProperties: {}
      example:
        current_trophies: 5123
        best_trophies: 5400
        ranked_rating: 1675

    ClientCredentialsTokenRequest:
      type: object
      description: |-
        OAuth 2.0 Client Credentials request. Serialize all properties as
        `application/x-www-form-urlencoded`, not JSON. The client ID and secret
        are created and managed in the VGP Portal.
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: |-
            OAuth grant to request. For the VGP backend integration this must
            be exactly `client_credentials` (no quotation marks).
          example: client_credentials
        client_id:
          type: string
          minLength: 1
          description: Public identifier for the authorised VGP OAuth client; generated in the VGP Portal.
          example: YOUR_CLIENT_ID
        client_secret:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: |-
            Confidential VGP OAuth client secret. Displayed once on creation;
            store securely on your backend and never publish or embed in client code.
          example: YOUR_CLIENT_SECRET

    TokenResponse:
      type: object
      description: |-
        Successful OAuth 2.0 token response. Token lifetimes and granted scopes
        depend on server/client policy. Do not hard-code the example values.
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |-
            Short-lived bearer access token. Present it in the HTTP header
            `Authorization: Bearer <access_token>` when calling Sbarter APIs.
            Treat the token as a secret and do not log it.
          example: eyJ...REDACTED
        token_type:
          type: string
          enum: [Bearer]
          description: |-
            OAuth token type. `Bearer` means possession of the token is
            sufficient to authenticate a protected API request.
          example: Bearer
        expires_in:
          type: integer
          format: int32
          minimum: 0
          description: |-
            **Access token lifetime in seconds**, counted from token issuance.
            Example: `300` = **300 seconds = 5 minutes**. This is a relative
            lifetime, not a Unix timestamp or milliseconds. Cache the token,
            renew shortly before expiry and do not assume every issued token
            has the example lifetime.
          example: 300
        scope:
          type: string
          description: |-
            Space-separated list of OAuth scopes actually granted, when
            included in the response, for example `linking.read webhook.write`.
            The list can differ from the scopes configured in the specification.
          example: linking.read
    OAuthTokenError:
      type: object
      description: |-
        OAuth-style JSON error returned by the token endpoint. Depending on
        the infrastructure, some HTTP errors may instead contain plain HTML.
      required: [error]
      properties:
        error:
          type: string
          description: OAuth error identifier, for example `invalid_request`, `invalid_client` or `unsupported_grant_type`.
          example: invalid_request
        error_description:
          type: string
          description: Optional human-readable explanation intended for debugging; do not rely on its exact wording.
          example: 'Missing form parameter: grant_type'
        error_uri:
          type: string
          format: uri
          description: Optional URL providing further details about the error.

    DeepLinkGenerateRequest:
      type: object
      required: [providerGameId, providerUserId]
      properties:
        providerGameId:
          type: string
          description: >-
            Stable provider-side game identifier, as registered on the studio's partner
            configuration. Resolved to a Sbarter game here, so an id that is not configured is a
            404 rather than a link that cannot be redeemed.
          example: "some-game-id"
        providerUserId:
          type: string
          description: >-
            Stable provider-side account identifier the link will link. Not necessarily the
            player's display name.
          example: "user123456"
        providerDisplayName:
          type: string
          description: >-
            Human-readable provider display name. Strongly recommended: it is what the player is
            shown on the confirmation screen, and it is their only way to notice that a link which
            reached them belongs to somebody else. Without it the screen can show only the raw
            account id.
          example: "DragonSlayer42"
        expiresAt:
          type: string
          format: date-time
          description: >-
            Requested deadline. Optional. Capped by Sbarter's own maximum and defaulted to it when
            absent; a value already in the past is refused with 400. Read expiresAt in the
            response to see what was actually stored.
          example: "2025-12-12T13:00:00Z"
        destination:
          $ref: '#/components/schemas/DeepLinkDestination'

    DeepLinkDestination:
      type: object
      description: >-
        Optional Sbarter navigation target after the player confirms the link. Sbarter checks
        that the target exists, belongs to the resolved game, and is open for participation.
      required: [type, resourceId]
      properties:
        type:
          type: string
          enum: [tournament, challenge]
        resourceId:
          type: string
          format: uuid
          description: Sbarter tournament or challenge UUID, matching type; not a provider-side ID.

    DeepLinkGenerateResponse:
      type: object
      required: [linkId, deepLink, expiresAt]
      properties:
        linkId:
          type: string
          description: Opaque single-use identifier. Not a uuid; treat it as an opaque string.
          example: "dl_7f3k9q2mwz8c4n6b"
        deepLink:
          type: string
          description: >-
            The link to hand to the player. Hand it over whole - it must not be rebuilt from
            linkId, and its form is environment-specific. In production it is an https universal
            link, which opens the Sbarter app when installed and otherwise a page that leads to
            the app store.
          example: "https://sbarter.kinsta.cloud/linking/confirm/dl_7f3k9q2mwz8c4n6b"
        expiresAt:
          type: string
          format: date-time
          description: The deadline actually stored, after Sbarter's cap was applied.
          example: "2025-12-12T13:00:00Z"

    LinkingStatusRequest:
      type: object
      required: [providerGameId, providerUserId]
      properties:
        providerGameId:
          type: string
          description: Stable provider-side game identifier, as registered on the partner configuration.
          example: "some-game-id"
        providerUserId:
          type: string
          description: Stable provider-side account identifier to ask about.
          example: "user123456"

    LinkingStatusResponse:
      type: object
      required: [linked]
      properties:
        linked:
          type: boolean
          description: >-
            Whether this provider account is linked to a Sbarter account in one of the studio's
            games. False also covers accounts that are unknown or belong to another studio.
          example: true
        nickname:
          type: string
          description: The player's public Sbarter nickname. Present only when linked.
          example: "player_one"
        avatar:
          type: string
          description: URL of the player's public Sbarter avatar, when they have one.
          example: "https://cdn.sbarter.com/avatars/player_one.png"
        linkedAt:
          type: string
          format: date-time
          description: When the link was established. Present only when linked.
          example: "2025-12-12T12:45:00Z"
